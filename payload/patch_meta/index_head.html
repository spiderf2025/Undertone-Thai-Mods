<!-- custom-font-mod-start -->
<style id="custom-font-mod-fonts">
@font-face{font-family:GoogleSansThai;src:url('fonts/GoogleSans-Regular.ttf');font-weight:400;}
@font-face{font-family:GoogleSansThai;src:url('fonts/GoogleSans-Medium.ttf');font-weight:500;}
@font-face{font-family:GoogleSansThai;src:url('fonts/GoogleSans-Bold.ttf');font-weight:700;}

.cf-dock.cf-visible{display:flex;}
.cf-row{display:flex;align-items:center;}
.cf-label{color:#e6c47e;font-size:21px;font-weight:400;white-space:nowrap;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.85);flex-shrink:0;box-sizing:border-box;padding-right:16px;}
.cf-ctrl{position:relative;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.cf-trigger{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:240px;max-width:340px;padding:4px 14px;border-radius:0;border:1px solid rgba(230,196,126,.62);background:rgba(16,10,12,.38);color:#f5ebd6;font-size:19px;cursor:pointer;transition:border-color .15s,background .15s;}
.cf-trigger:hover{border-color:#f6d998;background:rgba(40,18,22,.58);color:#fff;}
.cf-trigger-val{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;}
.cf-arrow{opacity:.85;font-size:13px;color:#e6c47e;}
.cf-panel{position:absolute;left:0;top:calc(100% + 4px);width:320px;max-height:270px;display:none;flex-direction:column;border-radius:2px;border:1px solid rgba(230,196,126,.65);background:rgba(18,12,14,.96);backdrop-filter:blur(12px);box-shadow:0 14px 36px rgba(0,0,0,.82);overflow:hidden;z-index:100001;}
.cf-panel.open{display:flex;}
.cf-search-wrap{padding:8px;border-bottom:1px solid rgba(230,196,126,.22);}
.cf-search{width:100%;box-sizing:border-box;padding:6px 10px;border-radius:2px;border:1px solid rgba(230,196,126,.4);background:rgba(255,255,255,.06);color:#fff;font-size:15px;outline:none;}
.cf-search:focus{border-color:#e6c47e;}
.cf-list{flex:1;overflow-y:auto;padding:4px;max-height:210px;}
.cf-item{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:2px;cursor:pointer;font-size:15px;color:#e7e0d0;transition:background .12s;}
.cf-item:hover{background:rgba(230,196,126,.18);}
.cf-item.active{background:rgba(230,196,126,.28);color:#ffd98e;font-weight:600;}
.cf-item-sample{font-size:13px;opacity:.75;margin-left:8px;}
.cf-size-btn{padding:4px 16px;border-radius:0;border:1px solid transparent;background:transparent;color:#e6c47e;font-size:19px;cursor:pointer;transition:all .15s;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.85);}
.cf-size-btn:hover{color:#fff;border-color:rgba(230,196,126,.4);}

</style>

    renderAllSizeButtons();
  }
  window.__cfRefreshDockText = refreshDockText;

  function updateDockPosition() {
    if (!dockEl || !dockEl.classList.contains('cf-visible')) return;
    var vw = window.innerWidth || 1280;
    var vh = window.innerHeight || 720;
    var leftPx = vw * 0.21;
    var topPx = vh * 0.48;
    var labelW = vw * 0.13;
    var lblPx = Math.max(15, Math.round(vh * 0.026));
    var btnPx = Math.max(14, Math.round(vh * 0.023));
    try {
      if (window.fgui && fgui.GRoot && fgui.GRoot.inst) {
        var rw = fgui.GRoot.inst.width || 1;
        var rh = fgui.GRoot.inst.height || 1;
        var gs = window.GameSetting;
        if (gs && gs.fObj && gs.fObj.visible && gs.txtLang && gs.langList) {
          var pLbl = gs.txtLang.localToGlobal(0, 0);
          var pLst = gs.langList.localToGlobal(0, gs.langList.height);
          leftPx = (pLbl.x / rw) * vw;
          topPx = ((pLst.y / rh) * vh) + Math.round(vh * 0.022);
          labelW = Math.max(120, ((gs.langList.localToGlobal(0, 0).x - pLbl.x) / rw) * vw);
          if (gs.txtLang.fontSize) lblPx = Math.max(15, Math.round((gs.txtLang.fontSize / rh) * vh));
        } else if (window.__activeSettingView && window.__activeSettingView.langBtn) {
          var sv = window.__activeSettingView;
          var pBtn = sv.langBtn.localToGlobal(0, sv.langBtn.height);
          leftPx = (pBtn.x / rw) * vw;
          topPx = ((pBtn.y / rh) * vh) + 12;
          labelW = 140;
        }
      }
    } catch (e) {}
    dockEl.style.left = Math.round(leftPx) + 'px';
    dockEl.style.top = Math.round(topPx) + 'px';
    [fontLabelEl, uiSizeLabelEl, subSizeLabelEl].forEach(function (el) {
      if (el) {
        el.style.width = Math.round(labelW) + 'px';
        el.style.fontSize = lblPx + 'px';
      }
    });
    dockEl.querySelectorAll('.cf-trigger, .cf-size-btn').forEach(function (el) {
      el.style.fontSize = btnPx + 'px';
    });
  }
  window.addEventListener('resize', updateDockPosition);

  function ensureDockDom() {
    if (dockEl || !document.body) return;
    dockEl = document.createElement('div');
    dockEl.className = 'cf-dock';
    dockEl.innerHTML =
      '<div class="cf-row">' +
        '<div class="cf-label" id="cf-font-label"></div>' +
        '<div class="cf-ctrl">' +
          '<button type="button" class="cf-trigger">' +
            '<span class="cf-trigger-val"></span><span class="cf-arrow">▾</span>' +
          '</button>' +
          '<div class="cf-panel">' +
            '<div class="cf-search-wrap"><input type="text" class="cf-search"></div>' +
            '<div class="cf-list"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="cf-row">' +
        '<div class="cf-label" id="cf-ui-size-label"></div>' +
        '<div class="cf-ctrl" id="cf-ui-size-ctrl"></div>' +
      '</div>' +
      '<div class="cf-row">' +
        '<div class="cf-label" id="cf-sub-size-label"></div>' +
        '<div class="cf-ctrl" id="cf-sub-size-ctrl"></div>' +
      '</div>';
    document.body.appendChild(dockEl);
    fontLabelEl = dockEl.querySelector('#cf-font-label');
    uiSizeLabelEl = dockEl.querySelector('#cf-ui-size-label');
    subSizeLabelEl = dockEl.querySelector('#cf-sub-size-label');
    uiSizeCtrlEl = dockEl.querySelector('#cf-ui-size-ctrl');
    subSizeCtrlEl = dockEl.querySelector('#cf-sub-size-ctrl');
    triggerValEl = dockEl.querySelector('.cf-trigger-val');
    panelEl = dockEl.querySelector('.cf-panel');
    searchEl = dockEl.querySelector('.cf-search');
    listEl = dockEl.querySelector('.cf-list');

    dockEl.querySelector('.cf-trigger').addEventListener('click', function (ev) {
      ev.stopPropagation();
      var opening = !panelEl.classList.contains('open');
      panelEl.classList.toggle('open', opening);
      if (opening) {
        loadSystemFonts();
        renderFontList(searchEl.value);
        setTimeout(function () { searchEl.focus(); }, 20);
      }
    });
    searchEl.addEventListener('input', function () { renderFontList(searchEl.value); });
    searchEl.addEventListener('keydown', function (ev) { ev.stopPropagation(); });
    listEl.addEventListener('wheel', function (ev) { ev.stopPropagation(); }, { passive: true });
    document.addEventListener('click', function (ev) {
      if (dockEl && !dockEl.contains(ev.target)) panelEl.classList.remove('open');
    });
    refreshDockText();
  }

  function loadSystemFonts() {
    if (fontsLoaded) return;
    fontsLoaded = true;
    if (window.undertoneFontAPI && typeof window.undertoneFontAPI.getSystemFonts === 'function') {
      window.undertoneFontAPI.getSystemFonts().then(function (list) {
        if (Array.isArray(list) && list.length) {
          var merged = [DEFAULT_FONT];
          for (var i = 0; i < list.length; i++) {
            if (list[i] !== DEFAULT_FONT) merged.push(list[i]);
          }
          allFonts = merged;
          renderFontList(searchEl ? searchEl.value : '');
        }
      }).catch(function () {});
    }
  }

  window.__cfSetSettingOpen = function (isOpen) {
    ensureDockDom();
    if (!dockEl) return;
    dockEl.classList.toggle('cf-visible', !!isOpen);
    if (!isOpen && panelEl) panelEl.classList.remove('open');
    if (isOpen) {
      refreshDockText();
      loadSystemFonts();
      updateDockPosition();
      setTimeout(updateDockPosition, 60);
    }
  };

  window.addEventListener('keydown', function (ev) {
    if (ev.key === 'F9') {
      ensureDockDom();
      if (!dockEl) return;
      window.__cfSetSettingOpen(!dockEl.classList.contains('cf-visible'));
    }
  });
})();
</script>
<!-- custom-font-mod-end -->
